# ============================================================================
# Backoffice do Perfect Finish Studio — configuração do Pages CMS
# (pagescms.org, versão 2.x — repositório hunvreus/pagescms)
#
# O cliente entra em app.pagescms.org, faz o que precisa e grava. Cada gravação
# escreve no repositório e o site volta a ser publicado sozinho em 1 a 3
# minutos. Não precisa de saber o que é um repositório.
#
# TRÊS COISAS QUE NÃO SE MEXEM SEM PENSAR:
#
#  1. `settings.content.merge: true`. O valor por omissão é `false`, e com
#     `false` cada gravação reescreve o ficheiro só a partir dos campos aqui
#     declarados — tudo o que não estiver mapeado é APAGADO em silêncio.
#  2. Nas listas de opções a chave é `name`, não `value`. Com `value` o
#     backoffice mostra a etiqueta certa e grava o valor errado.
#  3. Os campos numéricos precisam de `step` explícito. Sem ele o passo é 1 e
#     o formulário recusa 79,90.
#
# O carregamento de fotografias falha acima de ~3,3 MB por ficheiro (limite do
# alojamento do Pages CMS) e ficheiros HEIC do iPhone não são aceites — está
# escrito nas ajudas dos campos onde isso interessa.
# ============================================================================

settings:
  hide: true            # tira o separador de definições da vista do cliente
  content:
    merge: true         # ver nota 1 acima
  commit:
    identity: user
    templates:
      create: 'Adiciona {filename} (backoffice)'
      update: 'Atualiza {filename} (backoffice)'
      delete: 'Remove {filename} (backoffice)'

media:
  - name: obras
    label: Fotografias de trabalhos
    input: assets/img/obras
    output: assets/img/obras
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
  - name: loja
    label: Fotografias de produtos
    input: assets/img/loja
    output: assets/img/loja
    extensions: [jpg, jpeg, png, webp]
    categories: [image]

content:

  # ══════════════════════════════════════════════════════════ 1. TRABALHOS
  # Primeiro porque é o que se mexe mais: um carro novo, umas fotografias.
  - name: trabalhos
    label: Trabalhos
    type: collection
    path: data/trabalhos
    filename: '{fields.slug}.json'
    format: json
    view:
      fields: [veiculo, servico, publicado, ordem]
      primary: veiculo
    fields:
      - name: veiculo
        label: Carro
        type: string
        required: true
        description: 'Marca e modelo. Exemplo: Mercedes-AMG CLA 45 S.'
      - name: servico
        label: O que se fez
        type: string
        required: true
        description: 'Em duas ou três palavras. Exemplo: Envelopamento.'
      - name: fotos
        label: Fotografias
        type: image
        list: true
        options: { path: assets/img/obras, extensions: [webp, avif, jpg, jpeg, png] }
        description: >-
          Estas são as fotografias que abrem quando alguém carrega no azulejo do
          serviço. Limites: falha acima de cerca de 3,3 MB por ficheiro, e o
          HEIC do iPhone não é aceite (no iPhone, Definições › Câmara ›
          Formatos › Mais compatível, ou exportar como JPEG).
      - name: publicado
        label: Mostrar no site
        type: boolean
        default: true
        description: 'Desligue para guardar sem publicar.'
      - name: destaque
        label: Destacar
        type: boolean
        default: false
        description: 'Sem efeito neste momento. Fica para quando houver uma zona de destaques.'
      - name: ordem
        label: Ordem
        type: number
        options: { step: 1, min: 1 }
        description: 'Número mais baixo aparece primeiro.'
      - name: slug
        label: Nome do ficheiro
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'
        description: >-
          Só minúsculas, números e hífenes. Dá o nome ao ficheiro e liga este
          trabalho às galerias dos serviços. NÃO mude depois de publicado.

  # ══════════════════════════════════════════════════════ 2. ANTES E DEPOIS
  - name: pares
    label: Antes e depois
    type: file
    path: data/pares.json
    format: json
    fields:
      - name: pares
        label: Comparadores
        type: object
        list: { collapsible: true, min: 1 }
        description: >-
          Os dois primeiros aparecem logo na página inicial; os restantes ficam
          atrás do botão «Ver mais». As duas fotografias de cada par têm de ser
          do MESMO ângulo e com a MESMA luz — é isso que faz a comparação valer.
        fields:
          - name: veiculo
            label: Carro
            type: string
            required: true
          - name: servico
            label: O que se fez
            type: string
            required: true
          - name: antes
            label: Fotografia ANTES
            type: image
            required: true
            options: { path: assets/img/obras, extensions: [webp, avif, jpg, jpeg, png] }
          - name: depois
            label: Fotografia DEPOIS
            type: image
            required: true
            options: { path: assets/img/obras, extensions: [webp, avif, jpg, jpeg, png] }
          - name: legenda
            label: Explicação
            type: text
            description: 'Uma ou duas frases sobre o que mudou.'
          - name: ordem
            label: Ordem
            type: number
            options: { step: 1, min: 1 }
            description: 'Os dois com número mais baixo é que ficam à vista.'
          - name: alt_antes
            label: Descrição da fotografia ANTES
            type: string
            description: >-
              Para quem não vê a imagem e para o Google. Descreva o que está na
              fotografia, não o serviço.
          - name: alt_depois
            label: Descrição da fotografia DEPOIS
            type: string
          - name: slug
            label: Identificador
            type: string
            pattern: '^[a-z0-9-]+$'
            hidden: true

  # ══════════════════════════════════════════════════════════ 3. SERVIÇOS
  - name: lista_servicos
    label: Serviços
    type: file
    path: data/lista-servicos.json
    format: json
    fields:
      - name: servicos
        label: Serviços
        type: object
        list: { collapsible: true, min: 1 }
        description: >-
          Todos os serviços do estúdio. Quem TEM fotografia aparece como azulejo
          na montra da página inicial; quem NÃO tem aparece só como nome na
          lista acima dela. Basta carregar uma fotografia para o serviço passar
          de nome a azulejo — não é preciso mexer em mais nada.
        fields:
          - name: nome
            label: Nome do serviço
            type: string
            required: true
            description: 'Como o cliente lhe chama. Exemplo: Pintura de Travão.'
          - name: imagem
            label: Fotografia
            type: image
            options: { path: assets/img/obras, extensions: [webp, avif, jpg, jpeg, png] }
            description: >-
              Deixe vazio se ainda não houver fotografia deste serviço — o nome
              continua na lista e não fica um buraco na grelha. Limites: cerca
              de 3,3 MB por ficheiro, e o HEIC do iPhone não é aceite.
          - name: obras
            label: Trabalhos que a galeria mostra
            type: select
            list: true
            description: >-
              Quais os trabalhos que abrem quando alguém carrega neste azulejo.
              Em branco, usa o trabalho a que a fotografia de cima pertence.
            options:
              values:
                - { name: amg-cla-45s, label: Mercedes-AMG CLA 45 S }
                - { name: audi-etron-gt, label: Audi e-tron GT }
                - { name: audi-q4-etron, label: Audi Q4 e-tron }
                - { name: audi-q7-camaleao, label: Audi Q7 S line }
                - { name: bmw-serie-5-pelicula, label: BMW Série 5 }
                - { name: bmw-serie-5-touring, label: BMW Série 5 Touring M Sport }
                - { name: ferrari-roma, label: Ferrari Roma }
                - { name: ford-mustang-dark-horse, label: Ford Mustang Dark Horse }
                - { name: lotus-emeya-ppf, label: Lotus Emeya }
                - { name: maserati-ghibli, label: Maserati Ghibli }
                - { name: mercedes-classe-a, label: Mercedes-Benz Classe A }
                - { name: porsche-911-992, label: Porsche 911 (992) }
                - { name: porsche-911-targa-gts, label: Porsche 911 Targa 4 GTS }
                - { name: rolls-royce-wraith, label: Rolls-Royce Wraith }
                - { name: smart-fortwo, label: Smart Fortwo }
                - { name: tesla-model-y, label: Tesla Model Y }
                - { name: tesla-pincas, label: Tesla — pinças de travão }
                - { name: vw-scirocco-r, label: VW Scirocco R }
          - name: curto
            label: Nome curto
            type: string
            description: >-
              Só se o nome completo não couber no azulejo. Exemplo: «Jantes»
              para «Reparação e Pintura de Jantes».
          - name: slug
            label: Identificador
            type: string
            required: true
            pattern: '^[a-z0-9-]+$'
            description: >-
              Só minúsculas, números e hífenes. É o endereço do bloco. NÃO mude
              depois de publicado: as ligações que já existirem deixam de
              funcionar.

  # ══════════════════════════════════════════════════════════════ 4. LOJA
  - name: loja
    label: Loja
    type: collection
    path: data/loja
    filename: '{fields.slug}.json'
    format: json
    view:
      fields: [nome, familia, preco, publicado]
      primary: nome
    fields:
      - name: nome
        label: Produto
        type: string
        required: true
      - name: familia
        label: Categoria
        type: select
        required: true
        options:
          values:
            - { name: Lavagem, label: Lavagem }
            - { name: Proteção, label: Proteção }
            - { name: Rodas, label: Rodas }
            - { name: Interior, label: Interior }
            - { name: Acessórios, label: Acessórios }
      - name: descricao
        label: Descrição
        type: text
        description: 'Duas ou três frases. O que é e para que serve.'
      - name: formato
        label: Formato
        type: string
        description: 'Exemplo: 500 ml, 1 L, kit de 3.'
      - name: preco
        label: Preço com IVA
        type: number
        options: { step: 0.01, min: 0 }
        description: >-
          Deixe vazio para aparecer «Sob consulta». Se puser um valor, tem de
          ser o preço FINAL com IVA — é o que a lei exige a quem vende a
          particulares.
      - name: foto
        label: Fotografia
        type: image
        options: { path: assets/img/loja, extensions: [webp, avif, jpg, jpeg, png] }
      - name: publicado
        label: Mostrar na loja
        type: boolean
        default: true
      - name: ordem
        label: Ordem
        type: number
        options: { step: 1, min: 1 }
      - name: slug
        label: Nome do ficheiro
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'
        description: 'Só minúsculas, números e hífenes. NÃO mude depois de publicado.'

  # ═══════════════════════════════════════════════════════ 5. AVALIAÇÕES
  - name: avaliacoes
    label: Avaliações do Google
    type: file
    path: data/avaliacoes.json
    format: json
    fields:
      - name: criticas
        label: Avaliações mostradas no site
        type: object
        list: { collapsible: true }
        description: >-
          Copie do perfil do Google do estúdio. Escreva o primeiro nome e a
          inicial do apelido (exemplo: «Nelson P.») e NÃO copie a fotografia da
          pessoa — é o que mantém isto conforme com a protecção de dados.
          A nota e o número total de avaliações mudam-se em «Dados do estúdio ›
          Google».
        fields:
          - name: autor
            label: Quem escreveu
            type: string
            required: true
            description: 'Primeiro nome e inicial. Exemplo: Nelson P.'
          - name: texto
            label: O que escreveu
            type: text
            required: true
          - name: estrelas
            label: Estrelas
            type: number
            options: { step: 1, min: 1, max: 5 }
          - name: quando
            label: Quando
            type: string
            description: 'Como aparece no Google. Exemplo: há um mês.'
          - name: nota_traducao
            label: Nota de tradução
            type: string
            description: 'Só se a avaliação estiver noutra língua. Exemplo: traduzido do inglês.'

  # ══════════════════════════════════════════════════ 6. DADOS DO ESTÚDIO
  # Último porque quase nunca muda. Os campos que o cliente não deve mexer
  # levam `hidden: true`: continuam no ficheiro e são editáveis por quem mantém
  # o site, mas ele não os vê. É melhor do que deixá-los à vista com um aviso —
  # um campo que não se deve mexer, à vista, é um convite a mexer.
  - name: definicoes
    label: Dados do estúdio
    type: file
    path: data/definicoes.json
    format: json
    fields:
      - name: contactos
        label: Contactos
        type: object
        fields:
          - name: telefone_texto
            label: Telefone (como aparece)
            type: string
            required: true
            description: 'Com espaços, como se lê. Exemplo: 968 828 510.'
          - name: telefone
            label: Telefone (para ligar)
            type: string
            required: true
            pattern: '^[0-9]{9}$'
            description: 'Nove dígitos seguidos, sem espaços. É o que o telemóvel marca.'
          - name: email
            label: E-mail
            type: string
            required: true
            description: >-
              OBRIGATÓRIO POR LEI (artigo 10.º do Decreto-Lei n.º 7/2004). O
              WhatsApp não substitui.
          - name: instagram
            label: Instagram
            type: string
          - name: facebook
            label: Facebook
            type: string
          - name: whatsapp
            label: WhatsApp
            type: string
            hidden: true

      - name: morada
        label: Morada
        type: object
        fields:
          - name: rua
            label: Rua e número
            type: string
            required: true
          - name: codigo_postal
            label: Código postal
            type: string
            required: true
            pattern: '^[0-9]{4}-[0-9]{3}$'
          - name: localidade
            label: Localidade
            type: string
            required: true
          - name: distrito
            label: Distrito
            type: string
            hidden: true
          - name: pais
            label: País
            type: string
            hidden: true
          - name: mapa
            label: Endereço do mapa
            type: string
            hidden: true
          - name: latitude
            label: Latitude
            type: number
            options: { step: 0.0000001 }
            hidden: true
          - name: longitude
            label: Longitude
            type: number
            options: { step: 0.0000001 }
            hidden: true

      - name: horario
        label: Horário
        type: object
        list: { collapsible: true, min: 1 }
        fields:
          - name: dias
            label: Dias
            type: string
            required: true
            description: 'Exemplo: Segunda a sexta.'
          - name: horas
            label: Horas
            type: string
            required: true
            description: 'Exemplo: 09:00 – 18:30. Ou «Encerrado».'
          - name: indices
            label: Dias da semana (números)
            type: string
            hidden: true

      - name: textos
        label: Textos do site
        type: object
        fields:
          - name: heroi_titulo
            label: Título grande da capa
            type: text
            required: true
            description: >-
              UMA LINHA POR LINHA: cada vez que carregar em Enter começa uma
              linha nova no site. Duas ou três palavras por linha — mais do que
              isso e a linha não cabe num telemóvel.
          - name: heroi_sub
            label: Linha por baixo do título
            type: string
            required: true
            description: >-
              Uma linha só. É aqui que devem estar os serviços e «Leiria» — é o
              que o Google lê para saber do que trata a página.
          - name: sobre
            label: Texto sobre o estúdio
            type: text
            description: 'Aparece na abertura dos Contactos.'

      - name: marca
        label: Marca
        type: object
        fields:
          - name: reclamo
            label: Linha pequena acima do título
            type: string
            required: true
            description: 'Aparece em maiúsculas douradas no topo da capa.'
          - name: descricao
            label: Descrição curta
            type: text
            required: true
            description: >-
              Aparece no rodapé de todas as páginas e é o que o Google usa para
              descrever o negócio. Uma ou duas frases.
          - name: nome
            label: Nome
            type: string
            required: true
          - name: nome_completo
            label: Nome completo (legal)
            type: string
            required: true
            description: 'Como consta nas Finanças. Aparece na informação legal.'

      - name: google
        label: Google
        type: object
        fields:
          - name: nota
            label: Nota
            type: number
            options: { step: 0.1, min: 0, max: 5 }
            description: 'A média que o perfil do Google mostra. Actualize quando mudar.'
          - name: total
            label: Número de avaliações
            type: number
            options: { step: 1, min: 0 }
          - name: perfil
            label: Endereço do perfil
            type: string
            description: 'Para onde vai o botão «Ver todas no Google».'
          - name: incorporar
            label: Endereço do mapa incorporado
            type: string
            hidden: true
          - name: endpoint
            label: Servidor das avaliações em directo
            type: string
            hidden: true

      - name: empresa
        label: Dados legais
        type: object
        description: 'Exigidos pelo artigo 10.º do Decreto-Lei n.º 7/2004. Aparecem em «Informação legal».'
        fields:
          - name: titular
            label: Nome civil completo do titular
            type: string
            required: true
            description: 'O nome comercial não chega — tem de constar o nome da pessoa.'
          - name: forma
            label: Forma jurídica
            type: string
            required: true
            description: 'Exemplo: Empresário em Nome Individual.'
          - name: nif
            label: NIF
            type: string
            required: true

      - name: capa
        label: Fotografias da capa
        type: object
        fields:
          - name: fotos
            label: Peças do mosaico
            type: image
            list: true
            options: { path: assets/img/obras, extensions: [webp, avif, jpg, jpeg, png] }
            hidden: true
