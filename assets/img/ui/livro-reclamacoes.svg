<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 84" role="img" aria-label="Livro de Reclamações Eletrónico">
<!-- Distintivo do Livro de Reclamações Eletrónico.
     O Decreto-Lei n.º 156/2005, art. 5.º-B, n.º 2 exige o ícone na página
     inicial, nas cores vermelho, azul, branco ou preto, com contraste, e com
     ligação para www.livroreclamacoes.pt. Este é um distintivo desenhado de
     raiz com essas cores; se a DGC fornecer a arte oficial, substituir o
     ficheiro mantendo o nome. -->
<rect width="264" height="84" rx="6" fill="#FFFFFF"/>
<rect x="1" y="1" width="262" height="82" rx="5" fill="none" stroke="#1B3A6B" stroke-width="2"/>
<!-- livro aberto -->
<g transform="translate(16 20)">
  <path d="M2 6h18c3.3 0 6 1.9 6 4.2V44c0-2.3-2.7-4.2-6-4.2H2z" fill="#C8102E"/>
  <path d="M50 6H32c-3.3 0-6 1.9-6 4.2V44c0-2.3 2.7-4.2 6-4.2h18z" fill="#1B3A6B"/>
  <path d="M26 10.2V44" stroke="#FFFFFF" stroke-width="2"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M7 15h13M7 22h13M7 29h9M32 15h13M32 22h13M32 29h9"/>
  </g>
</g>
<text x="82" y="36" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#1B3A6B">LIVRO DE</text>
<text x="82" y="55" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#C8102E">RECLAMAÇÕES</text>
<text x="82" y="70" font-family="Helvetica,Arial,sans-serif" font-size="9.5" letter-spacing=".8" fill="#3A3A3A">livroreclamacoes.pt</text>
</svg>
